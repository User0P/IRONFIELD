function formationSlot(i, count, form, spacing = 1.65) {
  const cols = Math.ceil(form === "line" ? Math.sqrt(count) * 1.8 : Math.sqrt(count));
  if (form === "wedge") { const r = Math.floor(Math.sqrt(i)); return { x: -r * spacing, z: (i - r * r - r) * spacing }; }

          const count = cfg.counts[e][KINDS.indexOf(k)];
          const slots = Array.from({ length: count }, (_, b) => formationSlot(b, count, cfg.formation[e]));
          const minZ = Math.min(...slots.map(p => p.z)), maxZ = Math.max(...slots.map(p => p.z));
          const off = present.length === 1 ? 0 : m === 0 ? -maxZ - 1.5 : -minZ + 1.5;
          anchors.set(k, { x: baseX - n * depth, z: baseZ + off });
          rowDepth = Math.max(rowDepth, ...slots.map(p => -p.x));
          halfWidth = Math.max(halfWidth, Math.abs(off) + Math.max(Math.abs(minZ), Math.abs(maxZ)));
        });
        if (present.length) depth += rowDepth + 4;
      }
      for (const k of ["lightHorse", "heavyHorse"]) {
        const count = cfg.counts[e][KINDS.indexOf(k)];
        const slots = Array.from({ length: count }, (_, b) => formationSlot(b, count, cfg.formation[e], 2.4));
        const maxAbs = Math.max(0, ...slots.map(p => Math.abs(p.z)));
        anchors.set(k, { x: baseX, z: baseZ + (k === "lightHorse" ? -1 : 1) * (halfWidth + maxAbs + 3) });
      }
      for (const k of KINDS) {
        const count = Math.max(0, Math.floor(cfg.counts[e][KINDS.indexOf(k)]));
        if (!count) continue;
        const spec = UNIT[k], a = anchors.get(k);
        const g = { id: this.groups.length, team: e, kind: k, order: "advance", x: a.x, z: a.z, formation: cfg.formation[e],
          initial: count, alive: count, cnt: count, targetGroup: -1, cx: a.x, cz: a.z, engaged: 0 };
        this.groups.push(g);
        for (let i = 0; i < count; i++) {
          const p = formationSlot(i, count, g.formation, spec.cavalry ? 2.4 : 1.65);
          const u = {
            id: this.units.length, team: e, kind: k, group: g.id,
            x: g.x + p.x * n, z: g.z + p.z, y: 0, vx: 0, vz: 0, angle: n * Math.PI / 2,
            hp: spec.hp, morale: 100, fatigue: 0, cooldown: this.random() * spec.interval, attack: 0, impact: false,
            target: -1, slotX: p.x * n, slotZ: p.z, dead: 0, routed: false, escaped: false, blocking: false,
            speed: 0, phase: this.random() * 6.28, kills: 0,
            swing: 0, hitT: -99, arrowT: -99, hitDx: 0, hitDz: 0, brace: false, routedAt: 0, threat: false,
            engaged: false, fallSign: 1,
            stamina: 100, guardT: -9, jy: 0, jv: 0, dealt: 0, blocks: 0, lastBlockT: -9, sprint: false, manual: false
          };
          u.y = terrainHeight(u.x, u.z, cfg.map);
          u.px = u.x; u.pz = u.z; u.py = u.y; u.pa = u.angle; u.pk = 0; u.pc = u.cooldown; u.pspd = 0;
          this.units.push(u); this.initial[e]++;

      }
    }
    this.totals = [...this.initial];
    if (cfg.mode === "duel") {
      this.aiTeams = [];
      this.duel = { diff: clampN(cfg.duelDiff ?? 1, 0, 2) };
      const me = this.units.find(u => u.team === 0), bot = this.units.find(u => u.team === 1);
      this.selected = me.id; this.playerId = me.id; this.botId = bot.id;
      bot.botInput = { x: 0, z: 0, face: null, attack: false, block: false, sprint: false, jump: false, spread: 1 };
      bot.strafeDir = 1; bot.strafeT = 0; bot.readT = null; bot.backT = 0;

  random() { this.seed = 1664525 * this.seed + 1013904223 >>> 0; return this.seed / 4294967296; }

  /* Player orders. group < 0 = whole army. */
  command(team, group, order, x, z, targetGroup = -1) {
    const gs = this.groups.filter(h => h.team === team && h.alive > 0);
    const mx = gs.reduce((s, h) => s + h.x, 0) / (gs.length || 1), mz = gs.reduce((s, h) => s + h.z, 0) / (gs.length || 1);
    for (const g of this.groups) if (g.team === team && (group < 0 || group === g.id)) {
      g.order = order; g.targetGroup = targetGroup;
      if (x !== undefined) {
        const keepShape = group < 0 && (order === "move" || order === "defend");
        g.x = x + (keepShape ? g.x - mx : 0); g.z = (z ?? 0) + (keepShape ? g.z - mz : 0);
      } else if (order === "hold" || order === "defend" || order === "advance" || order === "charge") {
        g.x = g.cx; g.z = g.cz;
      }
    }
  }

  formation(team, group, form) {
    for (const g of this.groups) if (g.team === team && (group < 0 || g.id === group)) {
      g.formation = form;
      const us = this.units.filter(u => u.group === g.id && u.hp > 0 && !u.routed);
      us.forEach((u, i) => { const p = formationSlot(i, us.length, form, UNIT[u.kind].cavalry ? 2.4 : 1.65); u.slotX = p.x * (team === 0 ? 1 : -1); u.slotZ = p.z; });
    }
  }

  nearest(u) {
    let best = -1, bd = Infinity;
    const r = UNIT[u.kind].ranged ? 35 : 16, tg = this.groups[u.group].targetGroup;
    this.grid.near(u.x, u.z, r, o => {
      if (o.team === u.team || o.hp <= 0 || o.escaped) return;
      const d = (o.x - u.x) ** 2 + (o.z - u.z) ** 2;
      if (d > r * r) return;
      const c = d * (o.routed ? 1.5 : 1) * (tg >= 0 && o.group !== tg ? 2 : 1);
      if (c < bd) { bd = c; best = o.id; }
    });
    return best;
  }

  enemyNear(u, r) {
    return this.grid.near(u.x, u.z, r, o => {
      if (o.team !== u.team && o.hp > 0 && !o.escaped && !o.routed && (o.x - u.x) ** 2 + (o.z - u.z) ** 2 < r * r) return true;
    });
  }

  cavalryAhead(u) {
    const fx = Math.sin(u.angle), fz = Math.cos(u.angle);
    return this.grid.near(u.x, u.z, 10, o => {
      if (o.team !== u.team && o.hp > 0 && !o.routed && UNIT[o.kind].cavalry) {
        const dx = o.x - u.x, dz = o.z - u.z;
        if (dx * dx + dz * dz < 100 && dx * fx + dz * fz > 0) return true;
      }
    });
  }

  damage(t, amount, pierce, src, projectile) {
    if (t.hp <= 0 || t.escaped) return;
    const a = UNIT[t.kind];
    const ang = Math.atan2(src.x - t.x, src.z - t.z);
    const frontal = Math.cos(ang - t.angle) > .15;
    let block = frontal ? (t.blocking ? .92 : a.shield * (projectile ? .9 : .45)) : 0;
    if (t.blocking && frontal) {
      t.stamina -= amount * (projectile ? .4 : .9); t.blocks++; t.lastBlockT = this.time;
      if (t.stamina <= 0) {
        t.stamina = 0; t.guardT = this.time + 1.1; t.blocking = false; block = a.shield * .45;
        this.events.push({ type: "guardbreak", x: t.x, y: t.y + 1.4, z: t.z, id: t.id });
      }
    }
    let dmg = amount * (100 / (100 + a.armour * (1 - pierce) * 2)) * (1 - block);
    if (projectile && Math.hypot(src.x - t.x, src.z - t.z) > 23) dmg *= .8;
    t.hp -= dmg; t.morale -= dmg * .09; if (src.team !== t.team) src.dealt += Math.min(dmg, t.hp + dmg); t.fatigue = Math.min(1, t.fatigue + .015);
    const dx = t.x - src.x, dz = t.z - src.z, dl = Math.hypot(dx, dz) || 1;
    t.hitT = this.time; t.hitDx = dx / dl; t.hitDz = dz / dl;
    if (projectile) t.arrowT = this.time;
    const ey = t.y + (a.cavalry ? 2.3 : 1.35);
    if (t.hp <= 0) {
      t.hp = 0; t.dead = this.time || .001; t.attack = 0; t.impact = false;
      t.fallSign = (t.hitDx * Math.sin(t.angle) + t.hitDz * Math.cos(t.angle)) > 0 ? 1 : -1;
      if (src.team !== t.team) src.kills++;
      const force = projectile ? 1.6 : UNIT[src.kind].cavalry ? 3.2 + Math.min(4, src.speed) : Math.min(4.2, 2.2 + dmg / 40);
      this.events.push({ type: "death", id: t.id, x: t.x, y: t.y, z: t.z, dx: t.hitDx, dz: t.hitDz, cav: !!a.cavalry, force });
      if (this.duel && this.winner === null) { this.winner = 1 - t.team; this.winTime = this.time; }
      this.grid.near(t.x, t.z, 8, f => { if (f.team === t.team && f.hp > 0) f.morale -= 1.8; });
    } else {
      this.events.push({ type: block > .4 ? "block" : "hit", x: t.x, y: ey, z: t.z, dx: t.hitDx, dz: t.hitDz, proj: projectile, id: t.id });
      t.x += t.hitDx * .12; t.z += t.hitDz * .12;
    }
  }

  fire(u, target, spreadMul = 1) {
    const s = UNIT[u.kind];
    const dist = Math.hypot(target.x - u.x, target.z - u.z);
    const v = u.kind === "crossbow" ? 34 : 25, tt = dist / v;
    const spread = (.16 + dist * .016) * (this.config.weather === "rain" ? 1.5 : 1) * spreadMul;
    const ax = target.x + target.vx * tt + (this.random() - .5) * spread;
    const az = target.z + target.vz * tt + (this.random() - .5) * spread;
    const y0 = u.y + 1.65, y1 = target.y + (UNIT[target.kind].cavalry ? 2 : 1.25);
    const p = { x: u.x, y: y0, z: u.z, vx: (ax - u.x) / tt, vz: (az - u.z) / tt, vy: (y1 - y0) / tt + 4.9 * tt,
      team: u.team, owner: u.id, damage: s.damage, pierce: s.pierce, ttl: 4, age: 0, kind: u.kind };
    p.px = p.x; p.py = p.y; p.pz = p.z;
    this.projectiles.push(p);
    this.events.push({ type: "shot", x: u.x, y: y0, z: u.z, kind: u.kind });
  }

  /* Player-aimed shot along the camera direction (first person) */
  fireAim(u, yaw, pitch) {
    const s = UNIT[u.kind], v = u.kind === "crossbow" ? 58 : 44;
    const cp = Math.cos(pitch), dx = Math.sin(yaw) * cp, dz = Math.cos(yaw) * cp, dy = Math.sin(pitch);
    const y0 = u.y + (s.cavalry ? 2.75 : 1.72);
    const p = { x: u.x + dx * .5, y: y0 + dy * .5, z: u.z + dz * .5, vx: dx * v, vy: dy * v, vz: dz * v,
      team: u.team, owner: u.id, damage: s.damage, pierce: s.pierce, ttl: 5, age: 0, kind: u.kind };
    p.px = p.x; p.py = p.y; p.pz = p.z;
    this.projectiles.push(p);
    this.events.push({ type: "shot", x: u.x, y: y0, z: u.z, kind: u.kind });
  }

  /* Resolve a manual (player or duel-bot) swing: hits whatever is in front, within reach */
  resolveManual(n, s) {
    const inp = n.botInput || this.input;
    const fx = Math.sin(n.angle), fz = Math.cos(n.angle);
    const coneCos = n.botInput ? .5 : inp.fp ? .64 : .34;
    const findFront = (range) => {
      let best = null, bd = Infinity;
      this.grid.near(n.x, n.z, range + 1, o => {
        if (o.team === n.team || o.hp <= 0 || o.escaped) return;
        const dx = o.x - n.x, dz = o.z - n.z, d = Math.hypot(dx, dz) || .001;
        const R = range + (UNIT[o.kind].cavalry ? .6 : .3);
        if (d <= R && (dx * fx + dz * fz) / d > coneCos && d < bd) { bd = d; best = o; }
      });
      return best;
    };
    if (s.ranged) {
      const close = findFront(1.8);
      if (!close) {
        if (n.botInput) { const t = this.units[this.playerId]; if (t && t.hp > 0) this.fire(n, t, inp.spread); }
        else if (inp.face != null) this.fireAim(n, inp.aimYaw, inp.aimPitch);
        else { const t = this.units[this.nearest(n)]; if (t) this.fire(n, t); }
        return;
      }
      this.damage(close, s.damage * .45 * (1 - n.fatigue * .22), s.pierce, n, false);
      return;
    }
    const t = findFront(s.reach);
    if (!t) { this.events.push({ type: "whiff", x: n.x, y: n.y + 1.4, z: n.z, team: n.team, id: n.id }); return; }
    let dmg = s.damage * (1 - n.fatigue * .22);
    if (s.cavalry) dmg *= 1 + Math.min(1.3, (n.chargeSpeed ?? n.speed) / 4);
    if (n.kind === "spear" && UNIT[t.kind].cavalry) dmg *= n.brace ? 2.1 : 1.7;
    this.damage(t, dmg, s.pierce, n, false);
  }

  /* Duel bot: reads the player's wind-up, blocks or steps out, strafes, ripostes */
  duelThink(dt) {
    const b = this.units[this.botId], p = this.units[this.playerId], inp = b.botInput;
    if (b.hp <= 0 || p.hp <= 0) { inp.x = inp.z = 0; inp.attack = inp.block = inp.sprint = false; return; }
    const D = DUEL_DIFF[this.duel.diff], s = UNIT[b.kind], ps = UNIT[p.kind];
    const dx = p.x - b.x, dz = p.z - b.z, dist = Math.hypot(dx, dz) || .001, ux = dx / dist, uz = dz / dist;
    inp.face = Math.atan2(dx, dz); inp.spread = D.spread;
    if (this.time > b.strafeT) { b.strafeDir = this.random() < .5 ? -1 : 1; b.strafeT = this.time + 1.1 + this.random() * 2.2; }
    const sx = -uz * b.strafeDir, sz = ux * b.strafeDir;
    let mx = 0, mz = 0; inp.attack = false;

    /* read the player's swing */
    const facing = -(Math.sin(p.angle) * ux + Math.cos(p.angle) * uz);
    const threat = p.attack > 0 && p.impact && dist < ps.reach + 1.1 && facing > .3;
    if (threat) { if (b.readT == null) { b.readT = this.time; const r = this.random(); b.reaction = r < D.block ? "block" : r < D.block + D.dodge * (1 - D.block) ? "dodge" : "none"; } }
    else b.readT = null;
    const reacted = threat && this.time - b.readT >= D.react;
    const blockNow = reacted && b.reaction === "block" && b.stamina > 10 && b.attack <= 0;
    if (blockNow) b.holdBlockT = this.time + .25;
    inp.block = blockNow || this.time < (b.holdBlockT || 0);
    if (reacted && b.reaction === "dodge") b.backT = this.time + .45;

    if (s.ranged) {
      const want = 15;
      if (dist < 5) { mx = -ux; mz = -uz; }
      else if (dist > 24) { mx = ux; mz = uz; }
      else { mx = sx * .8 + (dist < want ? -ux * .4 : ux * .2); mz = sz * .8 + (dist < want ? -uz * .4 : uz * .2); }
      if (b.cooldown <= 0 && !inp.block) inp.attack = this.random() < D.aggr * dt * 6;
    } else {
      const r = s.reach;
      if (this.time < b.backT && b.attack <= 0) { mx = -ux + sx * .3; mz = -uz + sz * .3; }
      else if (dist > r * .9) { mx = ux + sx * .3; mz = uz + sz * .3; }
      else if (dist < r * .45) { mx = -ux; mz = -uz; }
      else { mx = sx * .7; mz = sz * .7; }
      const riposte = this.time - b.lastBlockT < .7;                      // just blocked: hit back
      const punish = p.attack <= 0 && p.cooldown > .25;                     // player is recovering from a swing
      const playerReady = p.cooldown <= .15 && p.attack <= 0 && dist < ps.reach + .8;   // player could swing any moment
      let rate = D.aggr * (riposte ? 30 : punish ? 6 : playerReady ? .6 : 1.6);
      if (threat && b.reaction !== "none") rate = 0;                        // never trade into a swing we mean to stop
      if (!inp.block && b.cooldown <= 0 && dist <= r + .2 && b.stamina > 12 && this.random() < rate * dt) {
        inp.attack = true;
        if (this.random() < .4) b.backT = this.time + 1.0;
      }
      if (b.stamina < 18 && dist < r + 1.5) { mx = -ux; mz = -uz; }
    }
    const ml = Math.hypot(mx, mz);
    inp.x = ml > .01 ? mx / ml : 0; inp.z = ml > .01 ? mz / ml : 0;
    inp.sprint = !s.ranged && dist > 9;
  }

  step(dt) {
    const units = this.units, map = this.config.map;
    if (this.winner !== null) {
      for (const u of units) { u.px = u.x; u.pz = u.z; u.py = u.y; u.pa = u.angle; u.pk = u.attack; u.pc = u.cooldown; u.pspd = u.speed = 0; u.attack = 0; }
      this.time += dt; this.tick++; return;
    }
    for (const u of units) { u.px = u.x; u.pz = u.z; u.py = u.y; u.pa = u.angle; u.pk = u.attack; u.pc = u.cooldown; u.pspd = u.speed; }
    for (const p of this.projectiles) { p.px = p.x; p.py = p.y; p.pz = p.z; }
    this.time += dt; this.tick++;
    this.grid.build(units);
    if (this.tick % 15 === 1) this.refresh();
    if (this.time > 1 && this.tick % 30 === 0) for (const team of this.aiTeams) this.aiThink(team);
    if (this.duel) this.duelThink(dt);

    const cen = [{ x: 0, z: 0, n: 0 }, { x: 0, z: 0, n: 0 }];
    for (const u of units) if (u.hp > 0 && !u.routed && !u.escaped) { cen[u.team].x += u.x; cen[u.team].z += u.z; cen[u.team].n++; }
    for (const c of cen) { c.x /= c.n || 1; c.z /= c.n || 1; }

    /* Group anchors */
    for (const g of this.groups) {
      if (g.alive <= 0) continue;
      const spec = UNIT[g.kind];
      if (g.order === "retreat") {
        const edge = g.team === 0 ? -80 : 80, dx = edge - g.x;
        if (Math.abs(dx) > 1) g.x += Math.sign(dx) * spec.speed * .75 * dt;
        continue;
      }
      if (g.order !== "advance" && g.order !== "charge" && g.order !== "attack") continue;
      let tg = g.targetGroup >= 0 ? this.groups[g.targetGroup] : null;
      if (tg && tg.cnt <= 0) { g.targetGroup = -1; tg = null; }
      const tx = tg ? tg.cx : cen[1 - g.team].x, tz = tg ? tg.cz : cen[1 - g.team].z;
      let dx = tx - g.x, dz = tz - g.z;
      const d = Math.hypot(dx, dz);
      if (spec.cavalry && this.time < 7 && g.order === "advance") dz = (g.kind === "lightHorse" ? -30 : 30) - g.z;
      const stop = spec.ranged ? 22 : 1;
      if (d > stop) {
        const sp = spec.speed * (g.order === "charge" ? .9 : .65) * dt / (d || 1);
        g.x += dx * sp; g.z += dz * sp;
      }
    }

    /* Soldiers — update order alternates each tick so neither army always strikes first */
    const count = units.length, rev = this.tick % 2 === 1;
    for (let ii = 0; ii < count; ii++) {
      const n = units[rev ? count - 1 - ii : ii];
      if (n.hp <= 0 || n.escaped) continue;
      const s = UNIT[n.kind], g = this.groups[n.group];
      n.cooldown = Math.max(0, n.cooldown - dt); n.attack = Math.max(0, n.attack - dt);
      const ox = n.x, oz = n.z;
      const controlled = (n.id === this.selected || !!n.botInput) && !n.routed;
      if (!controlled) n.blocking = false;
      n.sprint = false;
      n.stamina = Math.min(100, n.stamina + dt * (n.blocking ? 5 : 18));
      if (!n.routed && ((this.tick + n.id) % 10 === 0 || (n.target < 0 && (this.tick + n.id) % 3 === 0))) n.target = this.nearest(n);
      let l = this.units[n.target];
      if (l && (l.hp <= 0 || l.escaped)) { n.target = -1; l = undefined; }
      let hx = 0, hz = 0;
      const dist = l ? Math.hypot(l.x - n.x, l.z - n.z) : Infinity;
      const close = s.ranged && dist < 4;
      const reach = close ? 1.6 : s.reach;
      const holdR = s.ranged ? s.reach + 4 : g.order === "defend" ? 18 : 12;
      const mayEngage = g.order !== "move" && g.order !== "retreat" &&
        (!(g.order === "hold" || g.order === "defend") || !l || Math.hypot(l.x - g.x, l.z - g.z) < holdR);
      n.engaged = !!l && !n.routed && dist <= reach + .6;
      if (n.kind === "spear" && (this.tick + n.id) % 6 === 0) n.brace = !n.routed && this.cavalryAhead(n);

      /* Resolve a swing that has reached its impact frame */
      if (n.impact && n.attack < .24) {
        n.impact = false;
        if (n.manual) { n.manual = false; this.resolveManual(n, s); }
        else if (l && dist <= reach + .25) {
          if (s.ranged && !close) this.fire(n, l);
          else {
            let dmg = s.damage * (s.ranged ? .45 : 1) * (1 - n.fatigue * .22);
            if (s.cavalry) dmg *= 1 + Math.min(1.3, (n.chargeSpeed ?? n.speed) / 4);
            if (n.kind === "spear" && UNIT[l.kind].cavalry) dmg *= n.brace ? 2.1 : 1.7;
            this.damage(l, dmg, s.pierce, n, false);
          }
        }
      }

      /* Morale: break, flee, recover, rally */
      if (!n.routed && n.morale < 18 && this.time > 8 && !this.duel) { n.routed = true; n.routedAt = this.time; n.target = -1; n.impact = false; n.attack = 0; n.brace = false; }
      if (n.routed) {
        if ((this.tick + n.id) % 8 === 0) n.threat = this.enemyNear(n, 20);
        if (n.threat || this.time - n.routedAt < 3) {
          hx = n.team === 0 ? -1 : 1; hz = n.z > 0 ? .15 : -.15;
        } else {
          n.morale = Math.min(100, n.morale + dt * 6);
          const cap = 30 + 70 * g.alive / g.initial;
          if (n.morale >= 45 && cap >= 50 && this.time - n.routedAt > 6) { n.routed = false; n.morale = 45; n.target = -1; this.events.push({ type: "rally", x: n.x, y: n.y, z: n.z }); }
        }
        if (Math.abs(n.x) > 88) { n.escaped = true; continue; }
      } else if (controlled) {
        const inp = n.botInput || this.input;
        hx = inp.x; hz = inp.z;

  soldier(u, rt, a, dSim) {
    if (u.escaped) return;
    const dead = u.hp <= 0;
    if (dead && rt - u.dead > 40 && this.preset === "performance") return;
    const s = UNIT[u.kind], look = LOOK[u.kind];
    const x = u.px + (u.x - u.px) * a, z = u.pz + (u.z - u.pz) * a, y = u.py + (u.y - u.py) * a;
    this.sphere.center.set(x, y + 1.3, z);
    if (!this.frustum.intersectsSphere(this.sphere)) return;
    const fpSelf = u.id === this.fpSelf && !dead;
    if (dead && u.rag && !UNIT[u.kind].cavalry) return;        // drawn as a ragdoll
    const ang = fpSelf ? this.fpYaw : dead ? u.angle : u.pa + wrapAngle(u.angle - u.pa) * a;
    const spd = u.pspd + (u.speed - u.pspd) * a;
    const atk = u.attack > u.pk ? u.attack : u.pk + (u.attack - u.pk) * a;
    const cd = u.cooldown > u.pc ? u.cooldown : u.pc + (u.cooldown - u.pc) * a;

    /* gait phase accumulates with speed (smooth at any game speed) */
    if (u.rg === undefined) u.rg = u.phase;
    if (!dead) u.rg += dSim * (s.cavalry ? (spd > 2.8 ? 2.6 + spd * .75 : 2.5 + spd * 2.2) : 3.6 + spd * 1.9);

    const T = TEAM[u.team], TD = TEAM_DARK[u.team];
    const fall = dead ? Math.min(1, Math.max(0, rt - u.dead) * 2.4) : 0, f = 1 - (1 - fall) * (1 - fall);
    const camD2 = (x - this.camera.position.x) ** 2 + (z - this.camera.position.z) ** 2;
    const near = camD2 < this.nearDist * this.nearDist;
    const prog = atk > 0 ? 1 - atk / .6 : -1;
    const sinceHit = rt - u.hitT;
    const st = Object.assign(this.st || (this.st = {}), {
      t: rt, gait: u.rg, spd, dead, routed: u.routed, brace: u.brace && !dead, blocking: u.blocking, cav: !!s.cavalry,
      mv: dead ? 0 : Math.min(1.25, spd / Math.max(1.2, s.speed * .7)),
      prog, v: dead ? 0 : swingCurve(prog), swing: u.swing,
      combat: !dead && (u.target >= 0 || u.engaged), recoil: sinceHit >= 0 && sinceHit < .35 && !dead ? 1 - sinceHit / .35 : 0,
      hitSide: (u.hitDx * Math.cos(u.angle) - u.hitDz * Math.sin(u.angle)) > 0 ? 1 : -1,
      shieldUp: !!look.shield && rt - u.arrowT < 3 && !u.engaged && prog < 0,
      reloadFrac: u.kind === "crossbow" && cd > .35 && atk <= 0 ? clampN(1 - (cd - .35) / (s.interval - .35), 0, 1) : -1
    });

      const pp = this.fpPitch, melee = !UNIT[u.kind].ranged;
      P.rs += -pp * .75 - (melee ? .3 : 0); P.ls += -pp * .75 - (melee && !look.shield ? .3 : 0); P.wp += -pp * .75;
      P.lean = 0; P.twist *= .4; P.headP = 0;
      if (melee && st.prog < 0 && !st.blocking) { P.wp += .55; P.rs += .12; }   /* rest: blade angled forward, out of the face */
    }
    if (dead) { P.rs = -.4; P.ls = -.4; P.ra = .9; P.la = .9; P.re = -.2; P.le = -.2; P.lean = 0; P.twist = 0; P.headP = .3; P.noWeapon = false; }

    this.sp = 0;
    this.v.set(x, y + .02 - f * (s.cavalry ? .25 : .08), z);
    this.eu.set(s.cavalry ? 0 : f * 1.48 * u.fallSign, ang, s.cavalry ? f * 1.38 * u.fallSign : 0, "YXZ");
    this.q.setFromEuler(this.eu);

    this.hideHead = fpSelf;
    if (!near && !fpSelf) { this.simple(u, s, look, st, T); this.hideHead = false; return; }
    if (s.cavalry) { this.horse(u, s, look, st, T, TD, near || fpSelf); this.hideHead = false; return; }

    const bob = Math.abs(Math.sin(u.rg)) * .05 * st.mv + Math.sin(rt * 1.6 + u.phase) * .008;

    this.upper(u, look, P, T, TD, near);
    this.pop(); this.pop();
    this.hideHead = false;
  }

  /* ---------------- ragdolls ---------------- */
  addRagdoll(u, ev) {
    if (u.rag || this.ragdolls.length >= this.ragCap) return;
    const s = UNIT[u.kind], look = LOOK[u.kind], cav = !!s.cavalry;
    const n = 18, P = new Float32Array(n * 3), Q = new Float32Array(n * 3);
    const ca = Math.cos(u.angle), sa = Math.sin(u.angle), lift = cav ? 1.0 : 0;
    const put = (i, lx, ly, lz) => { P[i * 3] = u.x + lx * ca + lz * sa; P[i * 3 + 1] = u.y + ly + lift; P[i * 3 + 2] = u.z - lx * sa + lz * ca; };
